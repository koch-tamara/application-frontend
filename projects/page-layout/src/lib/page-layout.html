<div class="page-layout-container">
    <div class="page-layout-container__header">
        <lib-language-switcher />
        <mat-icon class="page-layout-container__header__menu" [matMenuTriggerFor]="menu">menu</mat-icon>
    </div>
    @let img = image();
    <div class="page-layout-container__body">
        @if(!isMobile() || displayedTab() == tabId.introduction){
        <div class="page-layout-container__body__image">
            <img [src]="img.path" [alt]="img.altText">
        </div>
        }
        <div class="page-layout-container__body__content">
            @if (displayedTab() != tabId.introduction && isMobile()) {
            <div class="page-layout-container__body__content__goBack">
                <mat-icon (click)="goHome()">arrow_back</mat-icon>
            </div>
            }
            <div class="page-layout-container__body__content__scroll-body">
                <ng-content></ng-content>
            </div>
        </div>
    </div>
    <div class="page-layout-container__footer">
    </div>
</div>

<mat-menu #menu="matMenu" panelClass="custom-page-menu">
    @for (tab of tabs; track tab.id) {
    <button mat-menu-item [routerLink]="['/', tab.id]">
        {{ tab.label| titlecase }}
    </button>
    }
</mat-menu>
